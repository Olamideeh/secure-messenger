
spring.datasource.url=jdbc:postgresql://localhost:5432/secure_messenger
spring.datasource.username=messenger_user
spring.datasource.password=local_dev_password

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
security.otp.hmac-secret=${OTP_HMAC_SECRET}
app.frontend.origin=http://localhost:5173

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
